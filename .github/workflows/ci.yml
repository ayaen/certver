name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test - live check
        run: ./build/cert_verifier check docs.openssl.org

      - name: Test - offline verify
        run: ./build/cert_verifier file certs/docs.openssl.org.fullchain.pem /etc/ssl/certs/ca-certificates.crt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t certver .

      - name: Docker test
        run: docker run certver check docs.openssl.org